# Push a tag like v0.1.0 to publish a release with the plugin zip attached.
# The tag must match `version` in calibre_plugin/__init__.py.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the tag matches the plugin version
        run: |
          version=$(python scripts/build_plugin.py --version)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version} (calibre_plugin/__init__.py)"
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build plugin zip
        run: |
          python scripts/build_plugin.py
          cp dist/AniList-Manga-Sync.zip "dist/AniList-Manga-Sync-${GITHUB_REF_NAME#v}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "Install: calibre → Preferences → Plugins → **Load plugin from file** → \`AniList-Manga-Sync-${GITHUB_REF_NAME#v}.zip\`, then restart calibre."
            echo "Then add your AniList token under Customize plugin."
            echo
            echo "## Changes"
            git log --pretty='- %s' ${prev:+"${prev}..${GITHUB_REF_NAME}"}
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" "dist/AniList-Manga-Sync-${GITHUB_REF_NAME#v}.zip" \
            --title "AniList Manga Sync ${GITHUB_REF_NAME#v}" --notes-file notes.md
